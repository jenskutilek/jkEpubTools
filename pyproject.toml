[project]
name = "jkEpubTools"
dynamic = ["version"]
description = "Jens Kutilek’s tools for building an epub from XHTML/CSS input files"
keywords = ["epub", "publishing"]

readme = "README.md"
license = "GPL-3.0-or-later"

authors = [{name = "Jens Kutílek", email = "webmail@kutilek.de"}]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "build",                # packaging build frontend
    "flake8",
    "wheel",                # build system (also downloaded during build)
    "ruff",
    "setuptools-scm[toml]"  # git tags-based versioning (also downloaded during build)
]

[project.urls]
"Homepage" = "https://github.com/jenskutilek/jkEpubTools"
# "Documentation" = "https://jkepubtools.readthedocs.io/"
"Bug Tracker" = "https://github.com/jenskutilek/jkEpubTools/issues"
# "Changelog" = "https://github.com/jenskutilek/fakelab/blob/main/CHANGELOG.md"

[project.scripts]
# jkepubbuild = "jkEpubTools.cmdline:main"

[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm[toml]>=9.2.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-data]
"jkEpubTools" = ["py.typed"]  # PEP 561

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
write_to = "src/jkEpubTools/_version.py"

[tool.pylint.main]
py-version = "3.11"
ignore-paths = ["src/jkEpubTools/_version.py"]
# extension-pkg-allow-list = ["pycurl"]

[tool.pylint.format]
expected-line-ending-format = "LF"
max-line-length = 88

[tool.pylint.design]
min-public-methods = 1
max-args = 15
max-positional-arguments = 10
max-attributes = 15
max-locals = 20

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX"]

[tool.mypy]
warn_unused_configs = true
cache_dir = "build/tests/mypy_cache"

allow_redefinition = true
warn_unreachable = true

disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_incomplete_stub = true

# disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true

[tool.black]
exclude = '[\\/]_version\.py$'
line-length = 88
target-version = ["py311"]

[tool.ruff]
extend-exclude =  ["examples"]

[tool.ruff.lint.isort]
known-first-party = ["jkEpubTools"]

